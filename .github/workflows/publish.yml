on:
  push:
    branches:
      - master
  workflow_dispatch:

name: Render and Publish to Github Pages

# Permissions needed to deploy GitHub Pages via workflow artifacts
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        
      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # To install LaTeX to build PDF book 
          # tinytex: true 
          # uncomment below and fill to pin a version
          version: 1.11.9
      
      # To update PATH
      - name: Set up TinyTeX via Quarto manually
        run: |
          quarto install tinytex --update-path
      - name: Update TeX packages
        run: |
          tlmgr update --self
          tlmgr update --all
      # To ensure dvisvgm installed
      - name: Install dvisvgm via TinyTeX
        run: |
          tlmgr update --self
          tlmgr install dvisvgm
          tlmgr path add
          dvisvgm --help
      
      - name: Install mutool
        run: sudo apt-get install mupdf-tools
      
      # To import libraries in advance for tikz image generation
      - name: Prepare for TikZ rendering
        run: |
          echo "" >> temp.qmd
          quarto render temp.qmd --to=pdf --template=_assets/suntemp-tikz.tex
          rm temp.qmd

      # From https://github.com/actions/setup-python
      - name: Setup Python
        uses: actions/setup-python@v6

      - name: Setup Python dependencies
        run: python3 -m pip install .

      # - name: Render Quarto Project
      #   uses: quarto-dev/quarto-actions/render@v2

      - name: Render Quarto Website
        run: quarto render
        env:
          QUARTO_PROFILE: website

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _output

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
